[project]
name = "multi-agent-trip-planner"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "airportsdata>=20260803",
    "certifi>=2026.7.22",
    "fastapi>=0.141.1",
    "jinja2>=3.1.6",
    "langchain>=1.3.16",
    "langchain-community>=0.4.2",
    "langchain-groq>=1.1.3",
    "langchain-mcp-adapters>=0.3.2",
    "langchain-tavily>=0.2.18",
    "langgraph>=1.2.11",
    "langgraph-checkpoint-postgres>=3.1.2",
    "mcp>=1.29.0",
    "nest-asyncio>=1.6.0",
    "psycopg-pool>=3.3.1",
    "psycopg[binary]>=3.3.4",
    "pycountry>=26.2.16",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "streamlit>=1.62.0",
    "tavily-python>=0.7.27",
    "urllib3>=2.7.0",
    "uvicorn>=0.52.4",
]

[project.scripts]
multi-agent-trip-planner = "multi_agent_trip_planner:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
